name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"

jobs:
  # Decides which jobs are worth running. Skipped jobs count as passing for required checks.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      packs: ${{ steps.filter.outputs.packs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Anything that changes the compiled binary or how it is built and tested.
            # docs/manual, dist and the GNOME extension are embedded with include_str!.
            code:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - '.config/**'
              - 'assets/**'
              - 'docs/manual/**'
              - 'dist/**'
              - 'gnome-extension/**'
              - '.github/workflows/ci.yml'
            # Library packs are embedded and validated by the Rust tests, but need no clippy or Windows run.
            packs:
              - 'packs/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.packs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build dependencies for the iced GUI and the tray. The GUI is not run here.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libfontconfig1-dev libdbus-1-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        if: needs.changes.outputs.code == 'true'
        run: cargo check --all-targets

      - name: Clippy (zero warnings)
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Tests
        run: cargo nextest run --profile agent --hide-progress-bar --cargo-quiet

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs, pack format, links, fonts
        run: python3 scripts/check-project.py

  install-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - name: Service units, udev rule, desktop entry, metainfo
        run: scripts/check-install.sh

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in Cargo.lock
        run: cargo audit
