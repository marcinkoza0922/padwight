<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padwight dashboard</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #d8d8de;
    --accent: #2f6fed; --good: #1f8a4c; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181b; --card: #212328; --text: #ececf0; --muted: #9a9aa5; --line: #34363d; --accent: #6b9bff; --good: #4cc27f; --warn: #e0a040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .pill { padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; }
  .on { color: var(--good); border-color: var(--good); }
  .off, .warn { color: var(--warn); border-color: var(--warn); }
  button, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .live { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .stick { width: 96px; height: 96px; border: 1px solid var(--line); border-radius: 50%; position: relative; }
  .stick i { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--accent); left: 50%; top: 50%; }
  .trigger { width: 14px; height: 96px; border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
  .trigger i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); height: 0; }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 160px; }
  .buttons span { padding: 2px 8px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 13px; }
  #error { display: none; color: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Padwight</h1>
    <span id="error"></span>
    <span id="enabled" class="pill"></span>
    <button id="toggle">…</button>
  </header>

  <section>
    <h2>Profile</h2>
    <div class="row" style="margin-bottom:12px">
      <select id="profiles" class="grow" aria-label="Profile"></select>
      <button id="activate" class="primary">Switch</button>
      <button id="next">Next</button>
      <button id="lock">Lock</button>
    </div>
    <dl id="now"></dl>
  </section>

  <section>
    <h2>Live input</h2>
    <div class="live">
      <div class="stick"><i id="ls"></i></div>
      <div class="trigger"><i id="lt"></i></div>
      <div class="trigger"><i id="rt"></i></div>
      <div class="stick"><i id="rs"></i></div>
      <div class="buttons" id="buttons"></div>
    </div>
    <p class="muted" id="device" style="margin-bottom:0"></p>
  </section>

  <section><h2>Controllers</h2><ul id="devices"></ul></section>
  <section><h2>Recent switches</h2><ul id="switches"></ul></section>
</main>

<script>
const $ = id => document.getElementById(id);
let status = null;

// Strings from the daemon (window titles, names) go in as text, never as HTML.
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.Error || res.statusText);
  return data;
}

function fail(e) {
  const box = $('error');
  box.style.display = e ? 'inline' : 'none';
  box.textContent = e ? e.message || String(e) : '';
}

const refList = (items, fill) => items.length === 0 ? [el('li', 'None', 'muted')] : items.map(fill);

function render(s) {
  status = s;
  $('enabled').textContent = s.enabled ? 'Remapping on' : 'Remapping off';
  $('enabled').className = 'pill ' + (s.enabled ? 'on' : 'off');
  $('toggle').textContent = s.enabled ? 'Turn off' : 'Turn on';
  $('lock').textContent = s.profile_locked ? 'Unlock' : 'Lock';

  const now = $('now');
  const rows = [
    ['Game', s.active_game || 'General'],
    ['Profile', s.active_profile + (s.profile_locked ? ' (locked)' : '')],
    ['Mode', s.active_mode || 'default'],
    ['Layers', s.active_layers.join(', ') || 'none'],
    ['Focused window', s.focused ? `${s.focused.title || s.focused.class} (${s.focused.exe})` : 'unknown'],
    ['Following', s.focus_backend],
  ];
  now.replaceChildren(...rows.flatMap(([k, v]) => [el('dt', k), el('dd', v)]));

  $('devices').replaceChildren(...refList(s.devices, d => {
    const li = el('li');
    li.append(el('strong', d.name), el('span', d.managed ? 'remapped' : d.ignored ? 'ignored' : 'not remapped', 'pill ' + (d.managed ? 'on' : '')));
    const features = ['rumble', 'gyro', 'touchpad', 'paddles'].filter(f => d[f]);
    if (features.length) li.append(el('span', features.join(', '), 'muted'));
    if (d.profile) li.append(el('span', '→ ' + d.profile, 'muted'));
    return li;
  }));

  $('switches').replaceChildren(...refList(s.switches.slice(0, 8), w => {
    const li = el('li');
    li.append(el('strong', w.profile), el('span', `${Math.round(w.age_ms / 1000)} s ago`, 'muted'), el('span', w.why, 'muted'));
    return li;
  }));
}

async function poll() {
  try { render(await api('/api/status')); fail(null); } catch (e) { fail(e); }
  setTimeout(poll, 1000);
}

async function loadProfiles() {
  try {
    const select = $('profiles');
    select.replaceChildren(...(await api('/api/profiles')).map(p => {
      const o = el('option', `${p.setup || 'General'}: ${p.profile}`);
      o.value = JSON.stringify(p);
      return o;
    }));
  } catch (e) { fail(e); }
}

const act = (path, body) => async () => {
  try { await api(path, body()); fail(null); render(await api('/api/status')); } catch (e) { fail(e); }
};
$('toggle').onclick = act('/api/enabled', () => ({ enabled: !status.enabled }));
$('lock').onclick = act('/api/lock', () => ({ locked: !status.profile_locked }));
$('next').onclick = act('/api/next', () => ({}));
$('activate').onclick = act('/api/profile', () => JSON.parse($('profiles').value));

// Sticks are -1..1 with Y down; the dot sits 40 px from the centre at full deflection.
function live(snap) {
  const dot = (id, [x, y]) => { $(id).style.transform = `translate(${x * 40}px, ${y * 40}px)`; };
  dot('ls', snap ? snap.left_stick : [0, 0]);
  dot('rs', snap ? snap.right_stick : [0, 0]);
  $('lt').style.height = (snap ? snap.left_trigger * 100 : 0) + '%';
  $('rt').style.height = (snap ? snap.right_trigger * 100 : 0) + '%';
  $('buttons').replaceChildren(...(snap ? snap.buttons : []).map(b => el('span', b)));
  $('device').textContent = snap ? snap.device : 'No controller in use. Press a button.';
}

function watch() {
  const events = new EventSource('/api/input');
  events.onmessage = e => live(JSON.parse(e.data));
  events.onerror = () => { events.close(); live(null); setTimeout(watch, 2000); };
}

live(null);
loadProfiles();
poll();
watch();
</script>
</body>
</html>
