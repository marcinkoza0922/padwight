# Per-game tables for scripts/binding-compare.py: pack selector -> engine action name(s).
# Selectors are input paths (button:South, gesture:button:Start:double_tap, stick:Left/ring0, trigger:Right,
# menu:<menu>/<label>) or a Guide label. `files` are read in order (later overrides earlier); the first
# must exist for the game to count as installed. `[selftest.*]` rows check each reader on tests/fixtures/bindings.

[game.deus-ex]
pack = "deus-ex"
engine = "unreal"
files = ["~/Games/Heroic/Deus Ex GOTY/System/DefUser.ini", "~/Games/Heroic/Deus Ex GOTY/System/User.ini"]
# DefUser.ini is the shipped default, User.ini the player's current file (it wins).
