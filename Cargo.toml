[package]
name = "padwight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
iced = { version = "0.14", features = ["svg", "image-without-codecs", "tokio", "markdown", "advanced"] }
# Offscreen drawing for overlay snapshots (snapshot.rs). Both are already in the lock file
# through iced, so the lock file doesn't change.
iced_runtime = "0.14"
# Reads a font file's family name without a renderer (font.rs); same version iced already locks.
fontdb = "0.23"
png = "0.17"
# Decodes the background pictures (PNG and JPEG only, so no AVIF or other codecs come along).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Rasterizes the app icon for the tray and window (iced already pulls it in).
resvg = "0.45"
# The overlay's own renderer (overlay/render): shapes text, and draws everything on the CPU.
# Both are already in the lock file through iced, so the lock file doesn't change.
cosmic-text = "0.15"
tiny-skia = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["io-util", "net", "rt", "time"] }
toml = "1.1.6"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2.190"
# File chooser for importing and exporting packs, through the desktop portal.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
zbus = "5"
# wlroots focus tracking (focus/wlroots.rs). Both are already in the lock file through
# iced's winit and smithay-client-toolkit, so the lock file doesn't change.
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
# The overlay's window (overlay/wayland.rs): fractional scaling and the viewporter.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# StatusNotifierItem tray icon.
ksni = { version = "0.3.6", features = ["blocking"] }
# Labels the on-screen keyboard's keys in the user's layout (keyboard/xkb.rs).
xkbcommon = "0.8"

[target.'cfg(windows)'.dependencies]
# File chooser for importing and exporting packs (the system's own dialog).
rfd = { version = "0.17", default-features = false }
# The control socket: AF_UNIX on Windows 10 and later. Already in the lock file through zbus.
uds_windows = "1.2"
# The virtual Xbox 360 pad, through the ViGEmBus driver.
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
# Win32 (input, output, focus, tray, processes) and WinRT (media session). Already in the lock
# file through cpal.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.clippy]
# Keep code compact and units small so they are cheaper to read.
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
# Keep debug noise out of test output.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[build-dependencies]
# Reads each library pack's listing at build time (`build.rs`).
toml = "1.1.6"

[dev-dependencies]
iced_test = "0.14"
